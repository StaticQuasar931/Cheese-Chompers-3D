const ASSET_BASE = new URL("./", window.location.href).href;
const BUILD="Build/";
const NAME="CheeseChompers3dWebUpdate";
const TOTAL_PARTS=13;
const PART_SIZE=10485760;
const RETRIES=5;

const $=id=>document.getElementById(id);
const canvas=$("unity-canvas");
const bar=$("unity-loading-bar");
const fill=$("unity-progress-bar-full");
const text=$("loadingText");
const percent=$("loadingPercent");
const count=$("fileCount");
const size=$("downloadSize");
const stage=$("stageText");

let completedParts=0;
let completedBytes=0;
let activeBytes=new Map();
let totalExpectedBytes=0;
let lastPercent=0;

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const mib=bytes=>(bytes/1048576).toFixed(1);

function progress(value){
  lastPercent=Math.max(lastPercent,Math.min(100,value));
  fill.style.width=lastPercent+"%";
  percent.textContent=Math.floor(lastPercent)+"%";
}

function updateStats(){
  const inFlight=[...activeBytes.values()].reduce((a,b)=>a+b,0);
  count.textContent=completedParts+" / "+TOTAL_PARTS+" files";
  size.textContent=mib(completedBytes+inFlight)+" MiB downloaded";
}

function showError(error){

  text.textContent="Unable to load game";
  stage.textContent="Download interrupted";
  $("loader-dot").style.background="#ff8996";
  $("loadingError").style.display="block";
  $("loadingError").textContent=error.message||String(error);
  $("retryButton").style.display="inline-block";
}

function unityShowBanner(message,type){
  const el=document.createElement("div");
  el.textContent=message;
  el.style.cssText=

    (type==="error"?"#a00000":"#b98a00");
  $("unity-warning").appendChild(el);
  if(type!=="error")setTimeout(()=>el.remove(),5000);
}

function badResponse(bytes){
  if(bytes.length<1024)return true;

  const preview=new TextDecoder()
    .decode(bytes.slice(0,512))
    .toLowerCase();

  return (
    preview.includes("429: too many requests")||
    preview.includes("too many requests")||
    preview.includes("rate limit exceeded")||
    preview.includes("<!doctype html")||
    preview.includes("<html")||
    preview.includes("github rate limit")
  );
}

/*
  JSDELIVR ONLY.
  Detects rate-limit responses even when they incorrectly
  arrive as HTTP 200, then retries the same CDN.
*/
async function downloadPart(path,label,key){
  const url=ASSET_BASE+path;
  let lastError;

  for(let attempt=1;attempt<=RETRIES;attempt++){
    activeBytes.set(key,0);
    updateStats();

    try{
      if(attempt>1){
        text.textContent="Retrying "+label;
        stage.textContent="Retry "+attempt+" of "+RETRIES;
      }

      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),90000);

      let response;
      try{
        response=await fetch(url,{
          cache:attempt===1?"default":"reload",
          signal:controller.signal
        });

        if(!response.ok){
          throw new Error("HTTP "+response.status);
        }

        let buffer;

        if(response.body&&response.body.getReader){
          const reader=response.body.getReader();
          const chunks=[];
          let received=0;

          while(true){
            const {done,value}=await reader.read();
            if(done)break;

            chunks.push(value);
            received+=value.byteLength;
            activeBytes.set(key,received);
            updateStats();
          }

          buffer=new Uint8Array(received);
          let offset=0;
          for(const chunk of chunks){
            buffer.set(chunk,offset);
            offset+=chunk.byteLength;
          }
        }else{
          buffer=new Uint8Array(await response.arrayBuffer());
        }

        if(badResponse(buffer)){
          throw new Error(
            "CDN returned an invalid response ("+
            buffer.length+" bytes)"
          );
        }

        console.log(
          "[Cheese Chompers]",label,
          buffer.byteLength,"bytes"
        );

        activeBytes.delete(key);
        completedParts++;
        completedBytes+=buffer.byteLength;

        updateStats();
        progress(completedParts/TOTAL_PARTS*65);

        return buffer;

      }finally{
        clearTimeout(timeout);
      }

    }catch(error){
      lastError=error;
      activeBytes.delete(key);
      updateStats();

      console.warn(
        "[Cheese Chompers] "+label+
        " attempt "+attempt+"/"+RETRIES+" failed:",
        error.message
      );

      if(attempt<RETRIES){
        const wait=Math.min(2000*Math.pow(2,attempt-1),16000);
        await sleep(wait);
      }
    }
  }

  throw new Error(
    label+" could not be downloaded from jsDelivr after "+
    RETRIES+" attempts. "+
    (lastError?.message||"Unknown error")
  );
}

async function combineParts(count,extension,label){
  const chunks=[];

  for(let i=1;i<=count;i++){
    const path=BUILD+NAME+extension+".part"+i;

    text.textContent="Downloading "+label;
    stage.textContent="File "+i+" of "+count+" · "+label;

    const chunk=await downloadPart(
      path,
      label+" part "+i,
      extension+i
    );

    /*
      Every non-final chunk is expected to be 10 MiB.
      This catches truncated chunks that are large enough
      to escape the generic HTML/error-response check.
    */
    if(i<count&&chunk.byteLength!==PART_SIZE){
      throw new Error(
        label+" part "+i+" has an unexpected size: "+
        chunk.byteLength+" bytes."
      );
    }

    chunks.push(chunk);
  }

  return new Blob(chunks,{type:"application/octet-stream"});
}

function scriptFrom(url){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=url;
    script.onload=resolve;
    script.onerror=()=>reject(new Error("Script unavailable: "+url));
    document.body.appendChild(script);
  });
}

async function loadUnity(){
  try{
    text.textContent="Downloading game files";
    stage.textContent="Fetching game assets";

    /*
      Both groups download concurrently.
      Files inside each group are assembled in order.
    */
    const [dataBlob,wasmBlob]=await Promise.all([
      combineParts(10,".data.unityweb","Game data"),
      combineParts(3,".wasm.unityweb","Game code")
    ]);

    text.textContent="Checking game files";
    stage.textContent="Validating WebAssembly";
    progress(68);

    const wasmBuffer=await wasmBlob.arrayBuffer();
    const wasmBytes=new Uint8Array(wasmBuffer);

    const rawWasm=
      wasmBytes[0]===0&&
      wasmBytes[1]===97&&
      wasmBytes[2]===115&&
      wasmBytes[3]===109;

    if(rawWasm&&!WebAssembly.validate(wasmBuffer)){
      throw new Error(
        "The assembled WebAssembly file is invalid. "+
        "jsDelivr may have returned a damaged or incomplete chunk."
      );
    }

    const dataUrl=URL.createObjectURL(dataBlob);
    const wasmUrl=URL.createObjectURL(wasmBlob);

    text.textContent="Preparing game engine";
    stage.textContent="Loading Unity";
    progress(70);

    await scriptFrom(ASSET_BASE+BUILD+NAME+".loader.js");

    if(typeof createUnityInstance!=="function"){
      throw new Error("Unity loader did not initialize.");
    }

    const config={
      dataUrl,
      codeUrl:wasmUrl,
      frameworkUrl:ASSET_BASE+BUILD+NAME+".framework.js.unityweb",
      streamingAssetsUrl:ASSET_BASE+"StreamingAssets",
      companyName:"DefaultCompany",
      productName:"CheeseChompers 3D",
      productVersion:"0.1",
      showBanner:unityShowBanner
    };

    text.textContent="Starting Cheese Chompers 3D";
    stage.textContent="Initializing game";

    const instance=await createUnityInstance(
      canvas,
      config,
      p=>{
        progress(70+Math.max(0,Math.min(1,p))*30);
        stage.textContent="Initializing game · "+Math.round(p*100)+"%";
      }
    );

    window.unityInstance=instance;
    progress(100);
    text.textContent="Ready to play";
    stage.textContent="Complete";

    setTimeout(()=>{
      bar.classList.add("done");
      setTimeout(()=>bar.style.display="none",400);
      canvas.focus();
    },300);

    console.log("[Cheese Chompers] Game ready");

  }catch(error){
    showError(error);
  }
}

loadUnity();
